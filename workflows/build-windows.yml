name: Build PandaMC for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out PandaMC
        uses: actions/checkout@v4

      - name: Set up Node.js on GitHub runner
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PandaMC-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
